services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: multi-agent-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5
    env_file:
      - backend/.env.example
    extra_hosts:
      - "host.docker.internal:host-gateway"
