[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "No-Agent"
version = "0.2.0"
description = "自进化 Agent 框架：技能脚本优先，失败时 AI 接管并自动修补，未知任务由 AI 完成并提炼为可复用技能"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # 0.0.45 起要求 datetime 带时区，存量的 naive datetime 写入会报错
    "sqlmodel>=0.0.22,<0.0.45",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Windows 没有系统时区库，脚本里的 zoneinfo 靠它（宿主把目录传给 worker）
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
browser = ["playwright>=1.45"]
# mcp 2.x 移除了 mcp.shared.memory.create_connected_server_and_client_session 等 API
mcp = ["mcp>=1.20,<2"]
sign = ["cryptography>=42"]
browser-use = ["browser-use>=1.0", "playwright>=1.45"]
dev = ["No-Agent[server,browser,mcp,sign]", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
no-agent = "no_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
no_agent = ["builtin_skills/*/*.md", "builtin_skills/*/*.json", "builtin_skills/*/scripts/*.py", "builtin_skills/*/tests/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
