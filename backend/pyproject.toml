[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "No-Agent"
version = "0.2.0"
description = "自进化 Agent 框架：技能脚本优先，失败时 AI 接管并自动修补，未知任务由 AI 完成并提炼为可复用技能"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
browser = ["playwright>=1.45"]
dev = ["No-Agent[server,browser]", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
no_agent = ["builtin_skills/*/*.py", "builtin_skills/*/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
