name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 内核信息（sandbox 档依赖 Landlock 与 seccomp）
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
      - name: 测试
        run: python -m pytest -q -rs
